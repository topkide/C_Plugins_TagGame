name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: '프리릴리스로 게시'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read plugin version
        id: meta
        run: |
          version="$(./gradlew -q properties --no-daemon \
            | awk -F': ' '/^version: /{print $2}')"
          if [ -z "$version" ]; then
            echo "::error::gradle.properties 에서 version 을 읽지 못했습니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify jar
        run: |
          jar="build/libs/TagGame-${{ steps.meta.outputs.version }}.jar"
          test -f "$jar" || { echo "::error::$jar 가 생성되지 않았습니다."; ls -l build/libs; exit 1; }
          unzip -p "$jar" plugin.yml
          ls -lh "$jar"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          jar="build/libs/TagGame-${VERSION}.jar"
          notes_flag=(--generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            notes_flag+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
          else
            gh release create "$TAG" "$jar" \
              --title "TagGame $TAG" \
              "${notes_flag[@]}"
          fi
