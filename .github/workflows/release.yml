name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: '프리릴리스로 게시'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read plugin version
        id: meta
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::gradle.properties 에서 version 을 읽지 못했습니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 태그 push 로 실행된 경우에만 그 태그를 쓰고,
          # 그 외(수동 실행/브랜치 push)에는 gradle.properties 버전으로 태그를 만든다.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      # build.yml 과 동일: 깨진 의존성 jar 감지 시 캐시 비우고 1회 재시도
      - name: Build
        run: |
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; then
            if grep -qE 'zip END header not found|error reading .*\.jar' /tmp/build.log; then
              echo "::warning::의존성 jar 손상 감지. 모듈 캐시를 비우고 재다운로드 후 재시도합니다."
              rm -rf ~/.gradle/caches/modules-2
              ./gradlew build --no-daemon --stacktrace --refresh-dependencies
            else
              exit 1
            fi
          fi

      - name: Verify jar
        run: |
          jar="build/libs/TagGame-${{ steps.meta.outputs.version }}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar 가 생성되지 않았습니다."
            ls -l build/libs
            exit 1
          fi
          echo "--- plugin.yml ---"
          unzip -p "$jar" plugin.yml
          ls -lh "$jar"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          jar="build/libs/TagGame-${VERSION}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "릴리스 $TAG 가 이미 존재합니다. jar 만 갱신합니다."
            gh release upload "$TAG" "$jar" --clobber
          else
            # --target 으로 빌드에 사용된 정확한 커밋에 태그를 고정한다.
            # (생략하면 기본 브랜치 HEAD 에 태그가 생겨 jar 과 소스가 어긋난다)
            args=(--title "TagGame $TAG" --generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "$jar" "${args[@]}"
          fi
          echo "릴리스 URL: $(gh release view "$TAG" --json url --jq .url)"
