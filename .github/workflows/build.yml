name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 의존성 jar 이 깨진 채로 받아지는 경우가 있어(zip END header not found),
      # 그 징후가 보이면 모듈 캐시를 비우고 한 번만 재다운로드하여 재시도한다.
      # 그 외의 실패(진짜 컴파일 에러 등)는 재시도 없이 즉시 실패시킨다.
      - name: Build
        run: |
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; then
            if grep -qE 'zip END header not found|error reading .*\.jar' /tmp/build.log; then
              echo "::warning::의존성 jar 손상 감지. 모듈 캐시를 비우고 재다운로드 후 재시도합니다."
              rm -rf ~/.gradle/caches/modules-2
              ./gradlew build --no-daemon --stacktrace --refresh-dependencies
            else
              exit 1
            fi
          fi

      - name: Show build output
        run: ls -lh build/libs

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: TagGame-plugin
          path: build/libs/*.jar
          if-no-files-found: error
