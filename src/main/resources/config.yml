# ============ TagGame - 술래잡기 ============

# 게임 제한시간 (초). 0이 되면 시민 승리  (/술잡 설정 타이머 <초>)
game-seconds: 300

# 술래가 움직일 수 없는 준비시간 (초)  (/술잡 설정 준비시간 <초>)
prep-seconds: 60

# 게임 시작 최소 참가 인원  (/술잡 설정 최소인원 <숫자>)
min-players: 2

# 랜덤으로 선정할 술래 수  (/술잡 설정 술래수 <숫자>)
tagger-count: 1

# 잡힌 시민 처리 방식: spectate(관전) / exclude(제외) / none(미설정 - 시작 불가)
# (/술잡관리 시민처리 <관전|제외>)
caught-mode: "none"

# 시민이 잡혔을 때 전체 공지 여부  (/술잡관리 공지 <켜기|끄기>)
catch-broadcast: true

# 술래가 전원 서버를 나갔을 때: end(게임 종료) / reassign(시민 중 새 술래 선정)
# (/술잡관리 술래퇴장 <종료|재선정>)
tagger-quit-action: "end"

# 준비시간 동안 술래에게 실명 효과 부여 (시야 차단)
prep-blindness: true

# 술래에게 지급되는 태그용 나무 검 (데미지 없음, 태그 판정 전용)
sword:
  name: "&c술래의 검"

# 보스바 설정 (색상: BLUE / GREEN / PINK / PURPLE / RED / WHITE / YELLOW)
bossbar:
  prep-title: "&b준비시간"
  prep-color: BLUE
  game-title: "&e술래잡기"
  game-color: YELLOW
  low-color: RED          # 남은 시간 30초 이하일 때 색상
  low-seconds: 30

messages:
  joined: "&a{player} 님이 술래잡기에 참가했습니다. (현재 {count}명)"
  left: "&7{player} 님이 술래잡기 참가를 취소했습니다. (현재 {count}명)"
  already-joined: "&7이미 참가 중입니다."
